<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1a3a">
<title>英语冒险岛 · 闯关打怪学英语</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1a3a'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23ffd93d'>A</text></svg>">
<style>
:root{
  --ink:#EDEBFF; --dim:#9C97C8; --line:rgba(255,255,255,.12);
  --bg:#141230; --bg2:#1F1B45;
  --gold:#FFD93D; --gold2:#F0A500;
  --hp:#FF4D6D; --mp:#4DA3FF; --exp:#4DE38A;
  --card:rgba(255,255,255,.06);
  --card-b:rgba(255,255,255,.14);
  --sh:0 8px 28px rgba(0,0,0,.38);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#0D0B22;color:var(--ink);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
#app{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg);}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(var(--safe-b) + 10px);
  opacity:0;visibility:hidden;transform:translateY(16px);
  transition:opacity .28s,transform .28s,visibility .28s;overflow:hidden;
}
.screen.active{opacity:1;visibility:visible;transform:none;}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 8%, rgba(120,90,255,.28), transparent 46%),
    radial-gradient(circle at 88% 92%, rgba(255,90,160,.2), transparent 48%),
    linear-gradient(175deg,#171433,#0F0D26 60%,#120F2C);
}
.screen>*{position:relative;z-index:1;}

/* 通用 */
.btn{
  border:none;font-family:inherit;font-weight:800;color:#241C00;border-radius:15px;cursor:pointer;
  font-size:16px;padding:14px;transition:transform .08s,box-shadow .08s,filter .15s;
  background:linear-gradient(180deg,#FFE066,#FFC300);
  box-shadow:0 5px 0 #C79400,0 8px 20px rgba(255,195,0,.28);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C79400;}
.btn:disabled{filter:grayscale(.8) brightness(.75);cursor:not-allowed;}
.btn.dark{background:linear-gradient(180deg,#3A3563,#2A2649);color:var(--ink);box-shadow:0 5px 0 #1A1734,0 8px 18px rgba(0,0,0,.35);}
.btn.dark:active{box-shadow:0 2px 0 #1A1734;}
.btn.blue{background:linear-gradient(180deg,#7CC4FF,#4DA3FF);color:#02203D;box-shadow:0 5px 0 #2B7ACC,0 8px 20px rgba(77,163,255,.3);}
.btn.blue:active{box-shadow:0 2px 0 #2B7ACC;}
.btn.pink{background:linear-gradient(180deg,#FF9CBB,#FF4D88);color:#3D0018;box-shadow:0 5px 0 #C42A5E,0 8px 20px rgba(255,77,136,.3);}
.btn.pink:active{box-shadow:0 2px 0 #C42A5E;}
.btn.wide{width:100%;}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;border:1px solid var(--card-b);
  background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
}
.icon-btn:active{transform:scale(.94);}

/* ============ 首页 ============ */
.hero-top{display:flex;align-items:center;gap:8px;}
.player-card{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--card-b);
  border-radius:15px;padding:7px 10px;backdrop-filter:blur(10px);
}
.pc-avatar{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(140deg,#6C5CE7,#4837C7);box-shadow:0 3px 10px rgba(108,92,231,.4);
}
.pc-info{flex:1;min-width:0;}
.pc-name{font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px;}
.lv-badge{font-size:9px;background:var(--gold);color:#3A2A00;padding:1px 6px;border-radius:6px;font-weight:900;}
.pc-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.13);margin-top:4px;overflow:hidden;}
.pc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4DE38A,#2FD073);transition:width .4s;}
.coin-box{
  display:flex;align-items:center;gap:4px;background:rgba(255,217,61,.14);border:1px solid rgba(255,217,61,.3);
  border-radius:12px;padding:8px 11px;font-size:13px;font-weight:900;color:var(--gold);
}
.logo-area{text-align:center;padding:14px 0 6px;}
.logo-island{
  display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:24px;
  background:linear-gradient(145deg,#7C6CF5,#4B39C9 55%,#2D1F8F);
  font-size:36px;box-shadow:0 14px 34px rgba(108,92,231,.45),inset 0 2px 0 rgba(255,255,255,.25);
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.game-title{
  font-size:28px;font-weight:900;letter-spacing:2px;margin-top:10px;
  background:linear-gradient(92deg,#FFE066,#FF8FB1,#7CC4FF);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.game-sub{font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:1.5px;}

.sec-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin:14px 0 9px;}
.sec-title::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--gold);}
.sec-title .hint{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600;}

/* 学段选择 */
.stage-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stage-pill{
  background:var(--card);border:1px solid var(--card-b);border-radius:13px;padding:10px 3px;text-align:center;
  cursor:pointer;transition:.16s;
}
.stage-pill .g{font-size:17px;}
.stage-pill .t{font-size:11px;font-weight:800;margin-top:3px;}
.stage-pill.on{background:linear-gradient(180deg,#7C6CF5,#5342D6);border-color:#8E7FFF;transform:translateY(-2px);box-shadow:0 6px 16px rgba(108,92,231,.4);}

/* 地图网格 */
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.map-card{
  position:relative;border-radius:17px;padding:12px;overflow:hidden;cursor:pointer;
  border:1px solid var(--card-b);transition:.16s;min-height:88px;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.map-card:active{transform:scale(.97);}
.map-card .bg{position:absolute;inset:0;opacity:.9;}
.map-card .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.62));}
.map-card .ico{position:absolute;right:8px;top:7px;font-size:26px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
.map-card .nm{font-size:13px;font-weight:900;position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.7);}
.map-card .sub{font-size:10px;color:rgba(255,255,255,.8);position:relative;z-index:2;margin-top:2px;font-weight:600;}
.map-card .lock{
  position:absolute;inset:0;background:rgba(10,8,26,.72);backdrop-filter:blur(2px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;gap:3px;
  font-size:11px;color:#B9B3E0;font-weight:700;
}
.map-card .lock .lk{font-size:19px;}
.map-card .stars-line{position:absolute;left:12px;top:8px;font-size:10px;z-index:2;letter-spacing:1px;}

.home-foot{margin-top:auto;display:flex;gap:8px;padding-top:10px;}
.home-foot .btn{flex:1;font-size:14px;padding:13px 6px;}

/* ============ 弹窗通用 ============ */
.overlay{
  position:absolute;inset:0;background:rgba(6,4,20,.78);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:150;
  opacity:0;visibility:hidden;transition:.22s;
}
.overlay.show{opacity:1;visibility:visible;}
.sheet{
  background:linear-gradient(175deg,#241F4D,#191537);border:1px solid var(--card-b);
  border-radius:24px;padding:20px 18px;width:100%;max-width:340px;max-height:86vh;overflow-y:auto;
  transform:scale(.92);transition:.24s cubic-bezier(.2,1.3,.5,1);box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.overlay.show .sheet{transform:scale(1);}
.sheet h3{font-size:17px;font-weight:900;text-align:center;margin-bottom:4px;}
.sheet .sub{font-size:11px;color:var(--dim);text-align:center;margin-bottom:14px;line-height:1.6;}
.sheet .acts{display:flex;gap:9px;margin-top:16px;}
.sheet .acts .btn{flex:1;font-size:14px;padding:12px;}

/* ============ 角色选择 ============ */
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.hero-item{
  background:var(--card);border:1px solid var(--card-b);border-radius:15px;padding:11px;cursor:pointer;
  transition:.15s;text-align:center;
}
.hero-item:active{transform:scale(.96);}
.hero-item.on{border-color:var(--gold);background:rgba(255,217,61,.1);box-shadow:0 0 0 1px var(--gold) inset,0 6px 18px rgba(255,195,0,.2);}
.hero-item .av{font-size:28px;line-height:1.1;}
.hero-item .nm{font-size:12px;font-weight:800;margin-top:4px;}
.hero-item .sk{font-size:9px;color:var(--gold);margin-top:2px;font-weight:700;}

/* ============ 战斗页 ============ */
.battle-hud{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;}
.hud-pill{background:var(--card);border:1px solid var(--card-b);border-radius:9px;padding:5px 9px;}
.hud-pill b{color:var(--gold);}

.enemy-zone{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;
  position:relative;
}
.enemy-name{font-size:12px;font-weight:800;color:#FFB3C7;display:flex;align-items:center;gap:6px;}
.enemy-hp-wrap{width:78%;height:11px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;border:1px solid rgba(255,77,109,.35);}
.enemy-hp{height:100%;width:100%;background:linear-gradient(90deg,#FF6B8A,#FF4D6D);transition:width .4s;border-radius:6px;}
.enemy-hp-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);}
.enemy-sprite{
  font-size:64px;line-height:1;filter:drop-shadow(0 8px 20px rgba(255,77,109,.35));
  animation:idle 2.4s ease-in-out infinite;
}
@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.04)}}
.enemy-sprite.hit{animation:enemyHit .4s;}
@keyframes enemyHit{0%{transform:translateX(0)}20%{transform:translateX(-12px) scale(.94);filter:brightness(2)}50%{transform:translateX(10px)}100%{transform:translateX(0)}}
.enemy-sprite.dead{animation:die .6s forwards;}
@keyframes die{to{transform:scale(.3) rotate(60deg);opacity:0}}

/* 答题卡 */
.q-card{
  flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px;
  background:linear-gradient(170deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  border:1px solid var(--card-b);border-radius:20px;padding:15px;margin:6px 0;overflow:hidden;
  position:relative;
}
.q-kind{
  align-self:center;font-size:9px;font-weight:900;letter-spacing:2px;padding:4px 12px;border-radius:20px;
  background:rgba(124,108,245,.28);color:#BFB3FF;border:1px solid rgba(124,108,245,.45);
}
.q-main-text{
  text-align:center;font-size:20px;font-weight:800;line-height:1.55;letter-spacing:.5px;
  word-break:break-word;
}
.q-main-text .en{font-family:Georgia,"Times New Roman",serif;font-size:23px;color:#FFF;}
.q-main-text .cn{font-size:14px;color:var(--dim);margin-top:5px;display:block;font-weight:600;}
.q-blank{
  display:inline-block;min-width:56px;border-bottom:2px solid var(--gold);color:var(--gold);
  padding:0 4px;font-weight:900;
}
.opts-b{display:flex;flex-direction:column;gap:8px;}
.opt-b{
  background:rgba(255,255,255,.07);border:1.5px solid var(--card-b);border-radius:13px;
  padding:11px 14px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:.14s;text-align:left;display:flex;align-items:center;gap:9px;
}
.opt-b .k{
  width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:rgba(255,255,255,.13);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--dim);
}
.opt-b:active{transform:scale(.985);background:rgba(255,255,255,.12);}
.opt-b.right{background:rgba(77,227,138,.2);border-color:#4DE38A;color:#B7F5D0;}
.opt-b.right .k{background:#4DE38A;color:#053A1D;}
.opt-b.wrong{background:rgba(255,77,109,.18);border-color:#FF4D6D;color:#FFC4CF;animation:shakeX .34s;}
.opt-b.wrong .k{background:#FF4D6D;color:#fff;}
.opt-b.dim{opacity:.38;}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}

/* 拼写输入题 */
.spell-in{
  width:100%;background:rgba(0,0,0,.3);border:2px solid var(--card-b);border-radius:14px;
  padding:13px;font-size:20px;font-family:Georgia,"Times New Roman",serif;letter-spacing:3px;
  text-align:center;color:var(--gold);outline:none;
}
.spell-in:focus{border-color:var(--gold);}

/* 玩家状态条 */
.pc-battle{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-b);
  border-radius:14px;padding:8px 11px;
}
.pc-battle .av{font-size:22px;}
.pc-battle .bars{flex:1;}
.pb-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.pb-lbl{font-size:8px;font-weight:900;color:var(--dim);width:16px;}
.pb{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;}
.pb i{display:block;height:100%;border-radius:4px;transition:width .4s;}
.pb.hp i{background:linear-gradient(90deg,#FF6B8A,#FF4D6D);}
.pb.mp i{background:linear-gradient(90deg,#7CC4FF,#4DA3FF);}
.pc-battle .combat-n{font-size:11px;font-weight:900;color:var(--gold);text-align:center;line-height:1.3;}
.pc-battle .combat-n small{display:block;font-size:8px;color:var(--dim);}

/* 伤害飘字 */
.dmg{
  position:absolute;font-size:26px;font-weight:900;pointer-events:none;z-index:60;
  animation:dmgUp .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6);
}
@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-58px) scale(1)}}

/* 技能栏 */
.skill-bar{display:flex;gap:7px;margin-top:6px;}
.skill-btn{
  flex:1;background:var(--card);border:1px solid var(--card-b);border-radius:13px;padding:8px 4px;
  color:var(--ink);font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;overflow:hidden;
}
.skill-btn .si{font-size:17px;}
.skill-btn:active{transform:scale(.95);}
.skill-btn .cd{
  position:absolute;inset:0;background:rgba(10,8,26,.75);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:var(--dim);
}
.skill-btn.ready{border-color:rgba(255,217,61,.5);}

/* ============ 结算 ============ */
.result-hero{text-align:center;padding:10px 0 2px;}
.big-ico{font-size:62px;display:inline-block;animation:popIn .6s cubic-bezier(.2,1.4,.5,1);}
@keyframes popIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.res-title{font-size:22px;font-weight:900;margin-top:8px;}
.res-sub{font-size:12px;color:var(--dim);margin-top:5px;font-weight:600;line-height:1.6;}
.res-stars{display:flex;justify-content:center;gap:8px;font-size:28px;margin-top:8px;}
.res-stars span{filter:grayscale(1) brightness(.5);transition:.3s;}
.res-stars span.on{filter:none;animation:popIn .5s cubic-bezier(.2,1.4,.5,1) both;}
.reward-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.rw{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:11px 4px;text-align:center;}
.rw .v{font-size:17px;font-weight:900;color:var(--gold);}
.rw .k{font-size:10px;color:var(--dim);font-weight:700;margin-top:2px;}
.wrong-box{margin-top:12px;background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:13px;max-height:150px;overflow-y:auto;}
.wrong-box h4{font-size:12px;font-weight:800;margin-bottom:8px;color:#FFB3C7;}
.wrong-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  background:rgba(255,77,109,.1);margin-bottom:5px;font-size:12px;font-weight:700;
}
.wrong-item .w{color:#FF9FB3;text-decoration:line-through;text-decoration-thickness:1.5px;}
.wrong-item .r{color:#7DFFB3;}

/* ============ 角色/背包页 ============ */
.tab-row{display:flex;gap:6px;margin-bottom:10px;}
.tab{
  flex:1;text-align:center;padding:9px;border-radius:11px;font-size:12px;font-weight:800;
  background:var(--card);border:1px solid var(--card-b);cursor:pointer;
}
.tab.on{background:linear-gradient(180deg,#7C6CF5,#5342D6);border-color:#8E7FFF;}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
.equip-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-b);
  border-radius:14px;padding:11px;margin-bottom:8px;
}
.equip-row .ei{font-size:24px;}
.equip-row .einfo{flex:1;}
.equip-row .en{font-size:13px;font-weight:800;}
.equip-row .ed{font-size:10px;color:var(--dim);margin-top:2px;}
.equip-row .buy{font-size:11px;font-weight:900;padding:7px 12px;border-radius:9px;border:none;background:var(--gold);color:#3A2A00;cursor:pointer;}
.equip-row .buy:disabled{background:rgba(255,255,255,.13);color:var(--dim);}
.equip-row.owned .buy{background:rgba(77,227,138,.25);color:#7DFFB3;}

/* 统计页 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-c{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:12px;text-align:center;}
.stat-c .v{font-size:19px;font-weight:900;color:var(--gold);}
.stat-c .k{font-size:10px;color:var(--dim);font-weight:700;margin-top:2px;}

/* toast */
.toast{
  position:absolute;left:50%;top:70px;transform:translate(-50%,-12px);
  background:rgba(20,16,45,.95);border:1px solid var(--card-b);color:var(--ink);
  font-size:12px;font-weight:700;padding:10px 18px;border-radius:13px;z-index:300;
  opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* 升级弹窗 */
.levelup{text-align:center;}
.levelup .lu-ico{font-size:56px;animation:popIn .6s;}
.levelup .lu-t{font-size:20px;font-weight:900;color:var(--gold);margin-top:6px;}
.levelup .lu-d{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7;}

@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:.1}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:120;}
@media (max-height:680px){
  .logo-island{width:56px;height:56px;font-size:26px}
  .game-title{font-size:22px} .logo-area{padding:6px 0 2px}
  .enemy-sprite{font-size:48px} .q-main-text{font-size:17px}
  .q-main-text .en{font-size:19px} .q-card{padding:11px;gap:8px}
  .map-card{min-height:74px;padding:9px} .sec-title{margin:9px 0 7px}

/* ================== 音效 ================== */
let actx=null;
function ac(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}} if(actx&&actx.state==='suspended')actx.resume(); return actx; }
function tone(f1,f2,dur,type,vol){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type=type||'sine';
  o.frequency.setValueAtTime(f1,c.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur*.7);
  g.gain.setValueAtTime(vol||.06,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  o.start();o.stop(c.currentTime+dur+.02);
}
const sHit=()=>{tone(880,1400,.12,'square',.05);};
const sMiss=()=>{tone(320,160,.22,'sawtooth',.06);};
const sDie=()=>{tone(600,120,.4,'triangle',.07);};
const sClick=()=>tone(520,null,.05,'sine',.04);
const sLevel=()=>{tone(660,1320,.35,'triangle',.09);};

function startBattle(mapId){

function spawnEnemy(){

  if(isBoss){
    ico = B.map.boss[0]; nm = B.map.boss[1];

    ico = e[0]; nm = e[1];

function updateEnemyHp(){

    : Math.ceil(pct) + '%';

}

function updatePlayerHud(){
  $('#pHp').style.width = Math.max(0,B.hp/B.maxHp*100) + '%';
  $('#pMp').style.width = Math.max(0,B.mp/B.maxMp*100) + '%';

/* ================== 出题 ================== */
function makeQuestion(){
  const pool = VOCAB[save.stage] || VOCAB[1];
  const item = pool[rnd(pool.length)];
  // 题型：60% 选中文, 25% 选英文, 15% 拼写（仅当词长<=9）
  const r = Math.random();
  let type = r < .6 ? 'm' : r < .85 ? 'e' : 's';
  if(type==='s' && item.w.length > 10) type = 'm';

  const others = shuffle(pool.filter(x=>x.w!==item.w)).slice(0,3);
  if(type==='m'){
    return {t:'m', word:item.w, ans:item.c, opts:shuffle([item.c, ...others.map(o=>o.c)])};
  }else if(type==='e'){
    return {t:'e', word:item.w, ans:item.w, cn:item.c, opts:shuffle([item.w, ...others.map(o=>o.w)])};
  }else{
    // 拼写：给中文首字母提示
    return {t:'s', word:item.w, ans:item.w, cn:item.c};
  }
}

function renderQuestion(){
  B.q = makeQuestion();
  B.locked = false; B.hintUsed = false;
  const q = B.q;
  const card = $('#qCard');
  const kindMap = {m:'选中文意思', e:'选英文单词', s:'拼写单词'};
  let html = `<div class="q-kind">${kindMap[q.t]}</div>`;

  if(q.t === 'm'){
    html += `<div class="q-main-text"><span class="en">${q.word}</span><span class="cn">这个词是什么意思？</span></div>
      <div class="opts-b">${q.opts.map((o,i)=>
        `<button class="opt-b" data-v="${o}"><span class="k">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>`;
  }else if(q.t === 'e'){
    html += `<div class="q-main-text"><span class="cn" style="font-size:20px;color:#fff">${q.cn}</span><span class="cn">选出对应的英文单词</span></div>
      <div class="opts-b">${q.opts.map((o,i)=>
        `<button class="opt-b" data-v="${o}" style="font-family:Georgia,serif"><span class="k">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>`;
  }else{
    const hint = q.ans[0] + '_ '.repeat(q.ans.length-1).trim();
    html += `<div class="q-main-text"><span class="cn" style="font-size:22px;color:#fff">${q.cn}</span>
      <span class="cn">拼出这个单词（${q.ans.length} 个字母）</span></div>
      <div style="text-align:center;font-family:Georgia,serif;font-size:18px;letter-spacing:6px;color:var(--gold)" id="spellHint">${hint}</div>
      <input class="spell-in" id="spellInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词">
      <button class="btn wide" id="spellSubmit" style="font-size:15px;padding:12px;">确定</button>`;
  }
  card.innerHTML = html;

  if(q.t==='s'){
    const inp = $('#spellInput');
    inp.addEventListener('input', ()=>{
      const v = inp.value.toUpperCase();
      const hint = q.ans.toUpperCase().split('').map((ch,i)=> v[i]===ch ? ch : '_').join(' ');
      $('#spellHint').textContent = hint;
    });
    $('#spellSubmit').onclick = ()=> checkSpell();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkSpell(); });
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 200);
  }else{
    $$('#qCard .opt-b').forEach(b=>{
      b.onclick = ()=> answerChoice(b, b.dataset.v);
    });
  }
  updatePlayerHud();
}

function checkSpell(){
  if(B.locked) return;
  const inp = $('#spellInput');
  const v = (inp.value||'').trim().toLowerCase();
  settle(v === B.q.ans.toLowerCase());
}

function answerChoice(btn, val){
  if(B.locked) return;
  const ok = val === B.q.ans;
  if(!ok){
    btn.classList.add('wrong');
    $$('#qCard .opt-b').forEach(b=>{
      if(b.dataset.v === B.q.ans) b.classList.add('right');
      else if(b!==btn) b.classList.add('dim');
    });
  }else{
    btn.classList.add('right');
  }
  settle(ok);
}

/* ================== 战斗结算 ================== */
function settle(ok){
  B.locked = true;
  const h = heroObj();
  const atkPower = (h.dmg||10) + (save.items.includes('boots')?4:0);

  if(ok){
    B.right++; B.combo++;
    if(B.combo > B.maxCombo) B.maxCombo = B.combo;
    // 伤害 = 基础 + 连击加成
    let dmg = atkPower + Math.min(10, B.combo-1)*2;
    if(B.bombNext){ dmg *= 2; B.bombNext = false; }
    if(h.healOnHit){ B.hp = Math.min(B.maxHp, B.hp + h.healOnHit); }

    // 敌人受伤
    if(B.isBoss){
      B.bossLeft--;
      B.enemyHp = B.bossLeft / B.bossTotal * 100;
    }else{
      B.enemyHp = 0;
    }
    updateEnemyHp();
    showDmg('-'+dmg, '#FFD93D');
    $('#enemySprite').classList.add('hit');
    setTimeout(()=>$('#enemySprite').classList.remove('hit'), 420);
    sHit();

    // 每次答对得金币/经验
    const coinGain = 3 + Math.min(5,B.combo);
    B.coin += coinGain;
    B.exp += 10;
    $('#battleCoin').textContent = B.coin;

    B.locked = true;
    setTimeout(()=>{
      if(B.enemyHp <= 0.5 && (!B.isBoss || B.bossLeft<=0)){
        killEnemy();
      }else{
        B.locked=false;
        renderQuestion();
      }
    }, 620);
  }else{
    B.wrong++; B.combo = 0;
    let dmg = 8;
    if(h.reduceDmg) dmg -= h.reduceDmg;
    if(save.items.includes('cloak')) dmg -= 4;
    dmg = Math.max(3, dmg);
    B.hp -= dmg;
    showDmg('-'+dmg, '#FF4D6D');
    sMiss();
    B.wrongList.push({q:B.q.word, ans:B.q.t==='m'?B.q.ans:B.q.word, cn:B.q.cn||B.q.ans});
    updatePlayerHud();

    // 低血保护：首次进入危险线自动回血一次，避免新手一步卡死
    if(!B.emergency && B.hp > 0 && B.hp <= B.maxHp*0.3){
      B.emergency = true;
      B.hp = Math.min(B.maxHp, B.hp + 35);
      setTimeout(()=>{ toast('💚 危急时刻！精灵之力为你回复 35 点生命'); }, 500);
      updatePlayerHud();
    }

    if(B.hp <= 0){ B.hp = 0; updatePlayerHud(); setTimeout(()=>gameOver(), 700); return; }

    B.locked = true;
    setTimeout(()=>{ B.locked=false; renderQuestion(); }, 1150);
  }
  updatePlayerHud();
}

function showDmg(txt, color){
  const zone = $('.enemy-zone');
  const el = document.createElement('div');
  el.className='dmg'; el.textContent = txt;
  el.style.color = color;
  el.style.left = '50%'; el.style.top = '58%';
  zone.appendChild(el);
  setTimeout(()=>el.remove(), 950);
}

function killEnemy(){
  const sp = $('#enemySprite');
  sp.classList.add('dead');
  sDie();
  B.coin += B.isBoss ? 40 : 12;
  B.exp += B.isBoss ? 60 : 18;
  $('#battleCoin').textContent = B.coin;

  setTimeout(()=>{
    B.wave++;
    if(B.wave > B.totalWave){ winBattle(); return; }
    spawnEnemy();
  }, 750);
}

/* ================== 结算 ================== */
function winBattle(){
  const total = B.right + B.wrong;
  const rate = total? B.right/total : 0;
  const stars = rate>=1 ? 3 : rate>=0.8 ? 2 : rate>=0.6 ? 1 : 0;
  const h = heroObj();
  let expGain = Math.round(B.exp * (1 + (h.expBonus||0)) * (save.items.includes('amulet')?1.2:1) * (save.items.includes('crown')?1.15:1));
  let coinGain = Math.round(B.coin * (1 + (h.coinBonus||0)) * (save.items.includes('ring')?1.25:1) * (save.items.includes('crown')?1.15:1));

  const key = B.mapId+'_'+save.stage;
  if(stars > (save.stars[key]||0)) save.stars[key] = stars;

  save.coin += coinGain;
  save.totalRight += B.right;
  save.totalWrong += B.wrong;
  save.battles = (save.battles||0)+1;
  const curWaveKey = 'w_'+key;
  if((save[curWaveKey]||0) < B.totalWave) save[curWaveKey] = B.totalWave;

  // 经验升级
  save.exp += expGain;
  let leveled = 0;
  while(save.exp >= expNeed(save.lv)){ save.exp -= expNeed(save.lv); save.lv++; leveled++; }
  persist();

  showResult(true, stars, expGain, coinGain, rate);
  if(leveled){
    try{ sLevel(); }catch(e){}
    setTimeout(()=>{
      $('#luDetail').textContent = `你的等级提升到了 Lv.${save.lv}！继续加油，词汇量又增加了。`;
      $('#ovLevelUp').classList.add('show');
      // 2.6 秒后自动关闭，避免挡住后续操作
      clearTimeout(window.__luT);
      window.__luT = setTimeout(()=>$('#ovLevelUp').classList.remove('show'), 2600);
    }, 900);
  }
}

function gameOver(){
  persist();
  showResult(false, 0, 0, 0, 0);
}

function showResult(win, stars, expGain, coinGain, rate){
  $('#resIco').textContent = win ? (stars===3?'🏆':stars===2?'🎖️':'🏅') : '💀';
  $('#resTitle').textContent = win ? (stars===3?'完美通关！':stars===2?'胜利！':'险胜！') : '战斗失败';
  $('#resTitle').style.color = win ? 'var(--gold)' : '#FF6B8A';
  const done = B.right + B.wrong;
  $('#resSub').textContent = win
    ? `${B.map.nm} · 击败 ${B.totalWave} 波敌人 · 正确率 ${Math.round(rate*100)}%`
    : `在第 ${B.wave} 波倒下了… 已答对 ${B.right} 题，再来一次吧！`;
  $('#rwRight').textContent = B.right;
  $('#rwExp').textContent = '+' + expGain;
  $('#rwCoin').textContent = '+' + coinGain;

  const starEls = $('#resStars').children;
  for(let i=0;i<3;i++){
    starEls[i].classList.remove('on');
    if(i<stars) setTimeout(()=>{ starEls[i].classList.add('on'); tone([660,830,1040][i],null,.25,'triangle',.07); }, 250+i*220);
  }

  if(B.wrongList.length){
    $('#wrongBox').style.display='block';
    const uniq = [];
    const seen = new Set();
    B.wrongList.forEach(w=>{ if(!seen.has(w.q)){ seen.add(w.q); uniq.push(w); } });
    $('#wrongList').innerHTML = uniq.slice(0,8).map(w=>
      `<div class="wrong-item"><span class="w">${w.q}</span><span class="r">${w.ans}</span></div>`).join('');
  }else{
    $('#wrongBox').style.display='none';
  }
  showScreen('screen-result');
  if(win && stars>=2) confettiRain();
}

  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1700);
}
function confettiRain(){
  const box=$('#confetti');
  const chars=['⭐','✨','🌟','💫','🎉','🪙','💎'];
  for(let i=0;i<26;i++){
    const d=document.createElement('div');
    d.textContent=chars[rnd(chars.length)];
    d.style.cssText=`position:absolute;top:-40px;left:${rnd(100)}%;font-size:${12+rnd(16)}px;animation:fall ${1.5+Math.random()*1.4}s linear ${Math.random()*.7}s forwards;`;
    box.appendChild(d);
    setTimeout(()=>d.remove(),3800);
  }
}

function renderShop(){

  $('#shopList').innerHTML = ITEMS.map(it=>{
    const owned = save.items.includes(it.id);
    return `<div class="equip-row ${owned?'owned':''}">
      <div class="ei">${it.ico}</div>
      <div class="einfo"><div class="en">${it.nm}</div><div class="ed">${it.desc}</div></div>
      <button class="buy" data-id="${it.id}" ${owned?'disabled':''} ${(!owned && save.coin<it.price)?'disabled':''}>
        ${owned?'已拥有':'🪙 '+it.price}
      </button>
    </div>`;
  }).join('');
  $$('#shopList .buy').forEach(b=>{
    b.onclick=()=>{
      const it = ITEMS.find(x=>x.id===b.dataset.id);
      if(!it || save.items.includes(it.id)) return;
      if(save.coin < it.price){ toast('金币不足'); sMiss(); return; }
      save.coin -= it.price; save.items.push(it.id); persist();
      sLevel(); toast('购买成功：'+it.nm); renderShop();
    };
  });
}

/* ================== 战绩 ================== */
function renderStats(){
  const total = save.totalRight + save.totalWrong;
  const acc = total ? Math.round(save.totalRight/total*100) : 0;
  const starCount = Object.values(save.stars).reduce((a,b)=>a+b,0);
  $('#statsGrid').innerHTML = `
    <div class="stat-c"><div class="v">Lv.${save.lv}</div><div class="k">当前等级</div></div>
    <div class="stat-c"><div class="v">${acc}%</div><div class="k">总正确率</div></div>
    <div class="stat-c"><div class="v">${save.totalRight}</div><div class="k">累计答对</div></div>
    <div class="stat-c"><div class="v">${starCount}</div><div class="k">获得星星</div></div>
    <div class="stat-c"><div class="v">${save.battles||0}</div><div class="k">战斗次数</div></div>
    <div class="stat-c"><div class="v">${save.coin}</div><div class="k">金币余额</div></div>`;
  const stageNm = {1:'小学',2:'初中',3:'高中',4:'成人'};
  $('#mapProgress').innerHTML = Object.keys(stageNm).map(s=>{
    const rows = MAPS.map(m=>{
      const st = save.stars[m.id+'_'+s]||0;
      return `<div style="display:flex;justify-content:space-between;padding:6px 10px;font-size:11px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:4px;">
        <span>${m.ico} ${m.nm}</span><span style="color:var(--gold)">${st?'⭐'.repeat(st):'—'}</span></div>`;
    }).join('');
    return `<div style="margin-bottom:12px;"><div style="font-size:11px;font-weight:800;color:var(--dim);margin:6px 0;">${stageNm[s]}阶段</div>${rows}</div>`;
  }).join('');
}

/* ================== 事件绑定 ================== */
$('#btnHero').onclick = ()=>{ sClick(); renderHeroPage(); showScreen('screen-hero'); };
$('#btnHeroBack').onclick = ()=>{ renderHome(); showScreen('screen-home'); };
$('#btnBag').onclick = ()=>{ sClick(); renderShop(); showScreen('screen-shop'); };
$('#btnShopBack').onclick = ()=>{ renderHome(); showScreen('screen-home'); };
$('#btnStats').onclick = ()=>{ sClick(); renderStats(); showScreen('screen-stats'); };
$('#btnStatsBack').onclick = ()=>{ renderHome(); showScreen('screen-home'); };
$('#btnResetAll').onclick = ()=>{
  if(confirm('确定重置全部进度吗？等级、金币、道具都会清空')){
    save = defaultSave(); persist(); renderHome(); renderStats(); toast('已重置');
  }
};
$('#btnFlee').onclick = ()=> $('#ovFlee').classList.add('show');
$('#fleeNo').onclick = ()=> $('#ovFlee').classList.remove('show');
$('#fleeYes').onclick = ()=>{ $('#ovFlee').classList.remove('show'); renderHome(); showScreen('screen-home'); };
$('#luOk').onclick = ()=>{ $('#ovLevelUp').classList.remove('show'); };
$('#btnResHome').onclick = ()=>{ renderHome(); showScreen('screen-home'); };
$('#btnResAgain').onclick = ()=>{ startBattle(B.mapId); };

document.addEventListener('touchmove', function(e){
  if(!e.target.closest('.scroll-area,.sheet')) e.preventDefault();
}, {passive:false});

renderHome();
